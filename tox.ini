[tox]
envlist = py310,py311,py312,py313
skipsdist = True

[testenv]
deps =
    pytest>=7.0.0
    pytest-mock>=3.10.0
    hypothesis>=6.0.0
    mcp[cli]>=1.4.1
    requests>=2.32.3
    python-dotenv>=1.0.1

commands =
    # Run compatibility tests only (fast)
    pytest tests/test_compatibility.py -v

    # Run all unit tests (no integration)
    pytest tests/ -m "not integration" -v --tb=short

[testenv:full]
# Full test suite including integration (requires .env)
commands =
    pytest tests/ -v --tb=short

[testenv:coverage]
deps =
    {[testenv]deps}
    pytest-cov>=4.0.0

commands =
    pytest tests/ -m "not integration" --cov=. --cov-report=term-missing --cov-report=html

[testenv:stress]
# Stress tests only
commands =
    pytest tests/test_stress.py -v

[testenv:security]
# Security regression tests only
commands =
    pytest tests/test_security_regression.py -v
    pytest tests/test_contract_schema.py -v -m "not integration"
